# Draft server{} fragment for techo.example.com. This is not a complete nginx.conf.
# Example only: adapt within your own HTTPS server block and configuration process.
location = /techo {
    access_log off;
    return 308 /techo/;
}

location ^~ /techo/ {
    client_max_body_size 2m;

    # No trailing slash: preserve the complete /techo/ prefix.
    proxy_pass http://127.0.0.1:8875;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tokens stay in headers; never add token/cookie headers to log formats.
    access_log off;
}
