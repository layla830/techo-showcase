  <rect y="450" width="800" height="350" fill="url(#table)"/>
  <path d="M0 451h800" stroke="#8f8678" stroke-width="2" opacity=".5"/>

  <ellipse cx="250" cy="672" rx="170" ry="26" fill="#8f8678" opacity=".28" filter="url(#soft)"/>
  <ellipse cx="595" cy="712" rx="180" ry="24" fill="#8f8678" opacity=".25" filter="url(#soft)"/>

