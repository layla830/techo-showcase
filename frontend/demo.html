<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5d5d5d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="techo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>techo · 作品演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Cormorant+Garamond:ital,wght@1,400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=showcase2">
<style>.demo-notice{position:sticky;top:0;z-index:10000;padding:9px 16px;background:#e8e3d9;color:#343434;font:13px sans-serif;text-align:center}form.add,form[data-new],.goal .ck,.goal .x,.entry .x{display:none!important}</style>
</head>
<body>
<div class="demo-notice">示例模式 · 内容均为虚构，仅供浏览</div>
<svg class="grain" aria-hidden="true"><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/><feDiffuseLighting lighting-color="#fff" surfaceScale="2.2"><feDistantLight azimuth="45" elevation="55"/></feDiffuseLighting></filter><rect width="100%" height="100%" filter="url(#paper)"/></svg>

<!-- 登录 -->
<main id="login" class="view" hidden>
  <div class="login-box">
    <div class="yr">techo</div>
    <p class="it">Your everyday journal</p>
    <form id="login-form">
      <input id="pw" type="password" autocomplete="current-password" placeholder="password">
      <button>open</button>
    </form>
    <p id="login-err" class="err"></p>
  </div>
</main>

<!-- 本子 -->
<main id="book" class="view" hidden>
  <header class="top">
    <div class="yr" id="yr">2026<small>This belongs to <span class="it">you</span></small></div>
    <nav id="tabs">
      <button data-tab="month" class="on">Monthly</button>
      <button data-tab="week">Weekly</button>
      <button data-tab="seen">Seen</button>
    </nav>
  </header>

  <section id="tab-month" class="tab">
    <div class="mhead">
      <button class="arrow" id="prev" aria-label="上个月">‹</button>
      <span class="n" id="mnum">11</span><span class="it" id="mname">November</span>
      <button class="arrow" id="next" aria-label="下个月">›</button>
      <button class="arrow cover" id="cover" aria-label="装修这个月的封面">✿</button><span class="r" id="days"></span>
    </div>
    <div class="layout">
      <div class="calwrap">
        <div class="week-head"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div class="grid" id="grid"></div>
        <div class="legend"><span><i></i>用户</span><span><i class="k"></i>AI助手</span><span>♡ 纪念日</span></div>
      </div>
      <aside class="side" id="side"></aside>
    </div>
    <div class="card" id="mgoal"></div>
  </section>

  <section id="tab-week" class="tab" hidden></section>
  <section id="tab-seen" class="tab" hidden></section>
</main>

<!-- 某一天 -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-in" id="sheet-in"></div>
</div>
<div class="scrim" id="scrim"></div>

<script src="demo-data.js"></script>
<script src="stickers.js?v=showcase2"></script>
<script src="app.js?v=showcase2"></script>
<script src="page.js?v=showcase2"></script>
</body>
</html>
